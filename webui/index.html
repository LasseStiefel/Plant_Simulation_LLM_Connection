<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plant Simulation Chat</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="is-empty">
    <div id="app-shell" class="app-shell">
        <header class="topbar">
            <div class="topbar-spacer"></div>
            <button id="variables-toggle" class="variables-toggle" type="button" aria-expanded="false" aria-controls="variables-drawer">
                Variables
            </button>
        </header>

        <main class="chat-stage">
            <div id="messages" class="messages" aria-live="polite"></div>

            <div class="composer-shell">
                <form id="composer" class="composer">
                    <textarea
                        id="message-input"
                        name="message"
                        rows="1"
                        placeholder="Ask anything"
                    ></textarea>
                    <div class="composer-actions">
                        <span id="status-text" class="status-text">Ready</span>
                        <button id="send-button" class="send-button" type="submit" aria-label="Send message">
                            <span class="send-arrow">&gt;</span>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>

    <aside id="variables-drawer" class="variables-drawer" aria-hidden="true">
        <div class="drawer-header">
            <h2>Variables</h2>
            <button id="close-drawer" class="close-drawer" type="button" aria-label="Close variables panel">
                x
            </button>
        </div>
        <div id="parameter-list" class="parameter-list"></div>
    </aside>

    <script src="/app.js"></script>
</body>
</html>
